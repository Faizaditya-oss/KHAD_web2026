<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" width="360" height="140">
  <defs>
    <linearGradient id="bronzeGradKMHE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A86B" />
      <stop offset="40%" stop-color="#C9803A" />
      <stop offset="70%" stop-color="#A65E1E" />
      <stop offset="100%" stop-color="#7D4210" />
    </linearGradient>
    <linearGradient id="plateGradKMHE" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FBF4EB" />
    </linearGradient>
    <filter id="dropShadowKMHE" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7D4210" flood-opacity="0.18" />
    </filter>
    <filter id="medalShadowKMHE" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Main Card Badge -->
  <rect x="8" y="8" width="344" height="124" rx="18" fill="url(#plateGradKMHE)" stroke="url(#bronzeGradKMHE)" stroke-width="2" filter="url(#dropShadowKMHE)"/>

  <!-- Left Circular Medal Emblem -->
  <g transform="translate(58, 70)" filter="url(#medalShadowKMHE)">
    <!-- Ribbon top -->
    <path d="M-14 -42 L-6 -54 L6 -54 L14 -42 Z" fill="#B91C1C" />
    <path d="M-8 -54 L0 -54 L0 -42 L-8 -42 Z" fill="#1D4ED8" />
    <!-- Outer Medal Ring -->
    <circle r="38" fill="url(#bronzeGradKMHE)" stroke="#FFF" stroke-width="1.5" />
    <circle r="33" fill="none" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.8" />
    <!-- Inner Medal Core -->
    <circle r="29" fill="#9A5317" />
    <!-- Star icon -->
    <path d="M0 -21 L2.5 -15 L8.5 -15 L3.5 -11.5 L5.5 -5.5 L0 -9 L-5.5 -5.5 L-3.5 -11.5 L-8.5 -15 L-2.5 -15 Z" fill="#FDE68A" />
    <!-- 3RD Text -->
    <text x="0" y="5" text-anchor="middle" fill="#FFFDF5" font-family="'Oswald', 'Impact', sans-serif" font-size="20" font-weight="900" letter-spacing="0.5">3RD</text>
    <text x="0" y="19" text-anchor="middle" fill="#FDE68A" font-family="'Oswald', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">PLACE</text>
  </g>

  <!-- Right Typography Details -->
  <g transform="translate(122, 38)">
    <!-- Bronze Tag -->
    <rect x="0" y="-14" width="112" height="18" rx="9" fill="#C9803A" fill-opacity="0.15" stroke="#C9803A" stroke-width="1" stroke-opacity="0.4"/>
    <text x="56" y="-2" text-anchor="middle" fill="#9A5317" font-family="'Oswald', sans-serif" font-size="9" font-weight="800" letter-spacing="1.2">PODIUM BRONZE</text>

    <!-- Main Title -->
    <text x="0" y="22" fill="#1E293B" font-family="'Oswald', sans-serif" font-size="15" font-weight="800" letter-spacing="0.3">3RD PLACE PODIUM</text>

    <!-- Event Name -->
    <text x="0" y="42" fill="#C9803A" font-family="'Oswald', sans-serif" font-size="13" font-weight="700" letter-spacing="0.2">Kontes Mobil Hemat Energi</text>

    <!-- Subtitle -->
    <text x="0" y="60" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">Tingkat Nasional • Sirkuit Jakarta E-Prix</text>
  </g>
</svg>
